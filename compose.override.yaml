# V4 add-on. Docker Compose automatically loads this file beside compose.yaml.
# Keeps the existing RSSHub, Telegram secret and all SQLite data unchanged.
services:
  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    restart: unless-stopped
    cpus: '1.25'
    mem_limit: 2560m
    environment:
      LT_HOST: '0.0.0.0'
      LT_PORT: '5000'
      LT_LOAD_ONLY: 'en,zh'
      LT_THREADS: '1'
      LT_CHAR_LIMIT: '1000'
      LT_DISABLE_WEB_UI: 'true'
      LT_DISABLE_FILES_TRANSLATION: 'true'
    volumes:
      - libretranslate_models:/home/libretranslate/.local:rw
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'
    healthcheck:
      test: ['CMD-SHELL', './venv/bin/python scripts/healthcheck.py']
      interval: 30s
      timeout: 12s
      retries: 6
      start_period: 240s
    networks: [events]
  collector:
    environment:
      TRANSLATE_ENABLED: 'true'
      TRANSLATE_ENDPOINT: 'http://libretranslate:5000/translate'
      TRANSLATE_TIMEOUT_SECONDS: '35'
      # Read-only snapshot written by market-report; answers /market /crypto /stocks /flow.
      MARKET_DB_PATH: /data/market_report.sqlite
  market-report:
    # Coinbase market brief v2 (public data, no API key): collection jobs + snapshot every 15 min,
    # Telegram brief every 4h in 3 parts, major anomaly pushes.
    # (UTC 00/04/08/12/16/20 = 北京 08/12/16/20/00/04). Design: market/DESIGN.md
    image: python:3.13-alpine
    restart: unless-stopped
    cpus: '0.25'
    mem_limit: 320m
    volumes:
      - ./src:/app:ro
      - ./data:/data
    secrets:
      - telegram_bot_token
      - smtp_password
      - email_recipients
    environment:
      TZ: UTC
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      TELEGRAM_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_CHAT_ID: '${TELEGRAM_CHAT_ID:?Set in .env}'
      REPORT_INTERVAL_HOURS: '4'
      REPORT_GRACE_MINUTES: '45'
      SNAPSHOT_REFRESH_MINUTES: '15'
      # v2 anomaly pushes: only new major anomalies, max per Beijing day, silent in quiet hours.
      ALERTS_ENABLED: 'true'
      ALERTS_MAX_PER_DAY: '8'
      QUIET_HOURS: '0-8'
      # E-mail channel (HTML brief). Stays off until SMTP is configured; password lives in secrets/smtp_password.
      EMAIL_ENABLED: 'false'
      # Once per recipient per local day at their local_time (default 08:30); list in secrets/email_recipients.json.
      EMAIL_TIME: '08:30'
      EMAIL_DEFAULT_LOCALE: 'zh'
      EMAIL_COLORS: 'cn'
      EMAIL_COLORS_EN: 'us'
      EMAIL_RECIPIENTS_FILE: /run/secrets/email_recipients
      EMAIL_REPLY_TO: ''
      EMAIL_TO: ''
      EMAIL_FROM: 'PureGamma AI <noreply@puregamma.ai>'
      SMTP_HOST: 'mail.gandi.net'
      SMTP_PORT: '587'
      SMTP_SECURITY: 'auto'
      SMTP_USER: 'noreply@puregamma.ai'
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      REPORT_DB_PATH: /data/market_report.sqlite
      LOG_LEVEL: INFO
    command: ["python", "/app/market_report.py"]
    healthcheck:
      test: ["CMD", "python", "/app/market_report.py", "--health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'
    networks: [events]
secrets:
  smtp_password:
    file: ./secrets/smtp_password
  email_recipients:
    file: ./secrets/email_recipients.json
volumes:
  libretranslate_models: {}
